
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Resume</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center">

    <div class="card">
        <h1>Create Your Resume</h1>

        <input type="text" id="name" placeholder="Your Full Name">
        <input type="text" id="role" placeholder="Desired Job Role">
        <input type="email" id="email" placeholder="Email Address">
        <input type="text" id="education" placeholder="Education">
        <textarea id="skills" placeholder="Your Technical Skills"></textarea>
        <textarea id="projects" placeholder="Your Projects and Achievements"></textarea>

        <button id="generateButton" onclick="generateResume()">Generate Resume</button>

        <a href="home.html" class="back-link">Back to Dashboard</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
